[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"


[project]
name = "photonrt"
version = "0.1.0"
description = "Native C++ image captioning runtime using ONNX Runtime"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "huggingface_hub>=0.30"
]

authors = [
    { name = "Lakshmi Ganapathi Kodi" }
]

license = { file = "LICENSE" }

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS"
]


[project.optional-dependencies]
dev = [
    "build",
    "twine"
]


[tool.scikit-build]
wheel.packages = [
    "python/photonrt"
]

cmake.build-type = "Release"

sdist.include = [
    "CMakeLists.txt",
    "CMakePresets.json",
    "LICENSE",
    "README.md",
    "include/**",
    "src/**",
    "vision/**",
    "bindings/**",
    "python/**"
]


[tool.scikit-build.cmake.define]
PHOTON_ENABLE_ONNXRUNTIME = "ON"
PHOTON_BUILD_PYTHON = "ON"
PHOTON_BUILD_EXAMPLES = "OFF"
PHOTON_BUILD_TESTS = "OFF"
PHOTON_BUILD_BENCHMARKS = "OFF"