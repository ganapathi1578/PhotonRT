name: Build Windows Wheels

on:
  push:
    branches:
      - main
      - feature/camera-streaming
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64 wheels
    runs-on: windows-2025

    permissions:
      contents: read

    env:
      CIBW_BUILD: >-
        cp39-win_amd64
        cp310-win_amd64
        cp311-win_amd64
        cp312-win_amd64
        cp313-win_amd64
        cp314-win_amd64

      CIBW_ARCHS_WINDOWS: AMD64

      CIBW_TEST_COMMAND: >-
        python -c
        "import photonrt;
        from photonrt import Captioner, CameraCaptioner;
        print('PhotonRT import OK:', photonrt.__version__)"

      CIBW_ENVIRONMENT_WINDOWS: >-
        PYTHONIOENCODING=utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          $version = "1.30.0"
          $archive = "$env:RUNNER_TEMP\onnxruntime-win-x64-$version.zip"
          $root = "$env:RUNNER_TEMP\onnxruntime-win-x64-$version"

          Write-Host "Downloading ONNX Runtime $version..."

          Invoke-WebRequest `
            -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-win-x64-$version.zip" `
            -OutFile $archive

          Write-Host "Extracting..."
          Expand-Archive `
            -Path $archive `
            -DestinationPath $env:RUNNER_TEMP `
            -Force

          if (-not (Test-Path "$root\include")) {
            throw "ONNX Runtime include directory not found: $root\include"
          }

          if (-not (Test-Path "$root\lib\onnxruntime.lib")) {
            throw "ONNX Runtime library not found: $root\lib\onnxruntime.lib"
          }

          Write-Host "ONNX Runtime root: $root"

          "PHOTON_ONNXRUNTIME_ROOT=$root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==4.2.1

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: wheelhouse

      - name: List wheels
        shell: pwsh
        run: |
          Get-ChildItem wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: photonrt-windows-wheels
          path: wheelhouse/*.whl
